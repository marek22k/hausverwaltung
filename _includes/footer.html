<div id="footer">
  <style>
    /* Basis */
    #footer{
      background:#ffffff;            /* weißer Hintergrund */
      color:#111111;                 /* schwarze Schrift */
      padding:24px 16px;             /* oben/unten 24px, links/rechts 16px */
      font-size:16px;                /* normale Schriftgröße in px */
      line-height:1.6;               /* angenehme Zeilenhöhe */
      border-top:1px solid #e5e7eb;  /* dezente Abgrenzung */
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #footer a{ color:#111111; text-decoration:none; }
    #footer a:hover, #footer a:focus{ text-decoration:underline; }

    /* Layout-Container: Desktop = 3 Spalten, Mobil = Stapel */
    .footer-container{
      max-width:1200px;
      margin:0 auto;
      display:grid;
      grid-template-columns: 1.2fr 1fr 0.8fr; /* links breiter, rechts schmaler */
      gap:24px;
      align-items:start;
    }

    /* Spalten */
    .footer-left strong{ font-size:18px; font-weight:700; }
    .footer-left a{ text-decoration:underline; text-underline-offset:2px; }

    .footer-right a{ display:inline-block; margin:4px 0; font-size:16px; }

    /* Logos: großzügig und klar lesbar */
    .footer-center{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:16px 20px;  /* vertikal 16px, horizontal 20px */
      padding-top:4px;
    }
    .footer-logo{ display:block; object-fit:contain; }

    /* Größen je Logo (in px) */
    .footer-logo--vdiv{
      max-width:320px;   /* breit, bleibt aber im Raster */
      width:100%;
      height:auto;
    }
    .footer-logo--ihk{
      height:110px;      /* deutlich größer für bessere Lesbarkeit */
      width:auto;
    }
    .footer-logo--zertifikat{
      height:110px;      /* ebenfalls groß */
      width:auto;
    }

    /* Tastatur-Fokus klar sichtbar */
    #footer a:focus-visible{
      outline:2px solid #2563eb;  /* kräftiges Blau */
      outline-offset:2px;
      border-radius:4px;
    }

    /* Hilfsklasse für Screenreader */
    .sr-only{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }

    /* Responsiv: unter 900px etwas luftiger, unter 640px stapeln */
    @media (max-width: 900px){
      .footer-container{
        grid-template-columns: 1fr; /* Spalten untereinander */
      }
      .footer-right, .footer-left{ font-size:16px; }
    }

    @media (max-width: 640px){
      .footer-center{
        flex-direction:column;      /* Logos untereinander */
        align-items:center;
      }
      .footer-center a{ margin-bottom:8px; }
      .footer-logo--vdiv{ max-width:300px; }
      .footer-logo--ihk, .footer-logo--zertifikat{ height:110px; }
    }
  </style>
